<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>实时摄像头画面</title>
    <style>
        /* 移除 body 的默认边距，让内容占据整个视口 */
        body {
            margin: 0;
            padding: 0;
            display: flex; /* 使用 flexbox 居中内容 */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; /* 确保 body 至少占满视口高度 */
            overflow: hidden; /* 防止出现不必要的滚动条 */
            background-color: #000; /* 可选：设置背景色，让全屏显示时更美观 */
        }
        
        /* 隐藏标题或根据需要调整样式 */
        h3 {
            color: #fff; /* 标题颜色 */
            margin: 10px 0;
        }

        /* 优化图片样式，扩大显示范围 */
        #img {
            /* 尝试占据视口的最大宽度和高度 */
            max-width: 100vw; 
            max-height: calc(100vh - 40px); /* 预留一些空间给标题 */
            width: auto;
            height: auto;
            /* 确保图像按比例完整显示在可用空间内 */
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <h3>实时图像</h3>
    <img id="img" />

    <script>
        // 保持 WebSocket 逻辑不变
        const ws = new WebSocket("ws://localhost:8081");
        ws.binaryType = "arraybuffer"; // 必须设置成二进制

        ws.onmessage = function (event) {
            const blob = new Blob([event.data], { type: "image/jpeg" });
            const url = URL.createObjectURL(blob);
            console.log("Received image data");
            
            document.getElementById("img").src = url;
        };
    </script>
</body>
</html>
